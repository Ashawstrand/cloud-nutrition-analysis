name: CI/CD Pipeline Simulation

#Trigger this workflow when pushing to main
on:
  push:
    branches: ["main"]

#specify GitHub VM ubuntu environment
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    #pulls repo into runner (VM)
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    #python version 3.10 (most universally supported/stable) setup
    - name: Python setup
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    #Install dependencies listed in requirements.txt (pandas,seaborn,etc.)
    - name: Install dependencies
      run: pip install -r requirements.txt

    #Execute Task 1 Python script
    - name: Run Task 1 analysis script
      run: python data_analysis.py

    #Execute Task 3 Lambda simulation
    - name: Run Task 3 serverless simulation
      run: python Task3/lambda_function.py

    #Checks that results.json produced output from lambda function
    # if file doesn't exist or empty, print error message
    - name: Verify results.json created
      run: |
        if [ ! -s Task3/simulated_nosql/results.json ]; then
          echo "results.json missing or empty"
          exit 1
        fi

    #Build Docker image from Task 2 Dockerfile
    - name: Build Docker image
      run: docker build -t nutrition-app .
